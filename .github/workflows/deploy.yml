name: Build & Push Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v7
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/league-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/league-app:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # این دو SDK key عمداً public هستند و داخل bundle مرورگر قرار می‌گیرند.
          build-args: |
            APP_VERSION=${{ github.sha }}
            NEXT_PUBLIC_APP_URL=https://app.gcamp.ir
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=phc_kSBj6z7S22kVUket4UcxLHsLSXapcp3sEj8jJFNkVQ23
            NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com
            NEXT_PUBLIC_SENTRY_DSN=https://7fc84fc8d06bf4177316f4da1ba67ba3@o4511949815349248.ingest.de.sentry.io/4511949852770384
            NEXT_PUBLIC_APP_ENV=production
            SENTRY_ORG=ayandetalayee
            SENTRY_PROJECT=javascript-nextjs
          secret-envs: |
            sentry_auth_token=SENTRY_AUTH_TOKEN
