x-app: &app
  image: ${APP_IMAGE:-league-app:local}
  build: .
  restart: unless-stopped
  mem_limit: 768m
  pids_limit: 256
  environment:
    - TZ=Asia/Tehran
    - NODE_OPTIONS=--max-old-space-size=640
  env_file: .env.production
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
    interval: 15s
    timeout: 5s
    start_period: 30s
    retries: 3
  networks:
    - league-net
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "5"

services:

  app:
    <<: *app
    ports:
      - "127.0.0.1:3000:3000"

  app-replica:
    <<: *app
    ports:
      - "127.0.0.1:3001:3000"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: league_db
      POSTGRES_USER: league_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U league_user -d league_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - league-net
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - league-net
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:

networks:
  league-net:
    driver: bridge
