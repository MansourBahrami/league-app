<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#1f3056" />
    <title>G-camp — آفلاین</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fef9ef;color:#2a2419;font-family:system-ui,sans-serif;padding:24px}.card{width:min(100%,390px);background:#fff;border:1px solid #cabc9e;border-radius:24px;padding:28px;text-align:center;box-shadow:0 12px 36px #1f305614}img{width:180px;height:auto}h1{font-size:22px;color:#1f3056;margin:18px 0 8px}p{font-size:15px;line-height:1.9;color:#6b5f49}button{min-height:48px;width:100%;border:0;border-radius:16px;background:#1f3056;color:#fff;font:700 15px system-ui,sans-serif;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/brand/gcamp-logo.webp" alt="G-camp" />
      <h1>اینترنت در دسترس نیست</h1>
      <p>جلسه‌ی فعال روی دستگاهت محفوظ می‌ماند. بعد از وصل‌شدن اینترنت، صفحه را دوباره باز کن تا با سرور همگام شود.</p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </main>
  </body>
</html>
